<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
  <!-- Kaggle dataset cover: 560x280 header, the centre 280x280 (x 140-420) is the thumbnail.
       Render: inkscape assets/kaggle-cover.svg -o assets/dataset-cover-image.png -w 560 -h 280 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#173229"/>
      <stop offset="1" stop-color="#0b1713"/>
    </radialGradient>
  </defs>
  <rect width="560" height="280" fill="url(#bg)"/>
  <rect width="560" height="4" fill="#ED2024"/>
  <rect y="276" width="560" height="4" fill="#278E43"/>

  <!-- the sun: 21 rays -->
  <g transform="translate(280 124)" fill="#FEBD11">
    <circle r="48" opacity="0.14"/>
    <g opacity="0.22" id="rays">
      <polygon points="-7,-56 7,-56 0,-112"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(17.142857)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(34.285714)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(51.428571)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(68.571429)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(85.714286)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(102.857143)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(120)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(137.142857)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(154.285714)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(171.428571)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(188.571429)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(205.714286)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(222.857143)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(240)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(257.142857)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(274.285714)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(291.428571)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(308.571429)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(325.714286)"/>
      <polygon points="-7,-56 7,-56 0,-112" transform="rotate(342.857143)"/>
    </g>
  </g>

  <!-- centre: "language" in both varieties -->
  <g text-anchor="middle" fill="#F7F3E8">
    <text x="280" y="134" font-family="Vazirmatn" font-weight="700" font-size="58" direction="rtl">زمان</text>
    <text x="280" y="180" font-family="IBM Plex Sans" font-weight="600" font-size="30">ziman</text>
    <text x="280" y="204" font-family="DejaVu Sans" font-size="13" opacity="0.7">/zɪˈmaːn/</text>
  </g>

  <g stroke="#F7F3E8" stroke-opacity="0.16">
    <line x1="140" y1="72" x2="140" y2="212"/>
    <line x1="420" y1="72" x2="420" y2="212"/>
  </g>

  <!-- left: Sorani -->
  <g text-anchor="middle" fill="#F7F3E8">
    <text x="70" y="110" font-family="Vazirmatn" font-weight="600" font-size="22" direction="rtl">سۆرانی</text>
    <text x="70" y="131" font-family="IBM Plex Sans" font-size="11" opacity="0.7">Sorani · ckb</text>
    <text x="70" y="168" font-family="IBM Plex Sans" font-weight="700" font-size="20" fill="#FEBD11">329k</text>
    <text x="70" y="185" font-family="IBM Plex Sans" font-size="11" opacity="0.7">word forms</text>
  </g>

  <!-- right: Kurmanji -->
  <g text-anchor="middle" fill="#F7F3E8">
    <text x="490" y="110" font-family="IBM Plex Sans" font-weight="600" font-size="21">Kurmancî</text>
    <text x="490" y="131" font-family="IBM Plex Sans" font-size="11" opacity="0.7">Kurmanji · kmr</text>
    <text x="490" y="168" font-family="IBM Plex Sans" font-weight="700" font-size="20" fill="#FEBD11">504k</text>
    <text x="490" y="185" font-family="IBM Plex Sans" font-size="11" opacity="0.7">word forms</text>
  </g>

  <text x="280" y="252" text-anchor="middle" font-family="IBM Plex Sans" font-weight="500" font-size="11"
        letter-spacing="4" fill="#F7F3E8" opacity="0.75">KURDISH LEXICON</text>
</svg>
