<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
  <!-- Kaggle dataset cover: 560x280 header, the centre 280x280 (x 140-420) is the thumbnail.
       Deliberately contains no counts, so it never needs updating when the data is rebuilt.
       Render: inkscape assets/kaggle-cover.svg -o assets/dataset-cover-image.png -w 560 -h 280 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#173229"/>
      <stop offset="1" stop-color="#0b1713"/>
    </radialGradient>
    <polygon id="ray" points="-7,-56 7,-56 0,-112"/>
  </defs>
  <rect width="560" height="280" fill="url(#bg)"/>
  <rect width="560" height="4" fill="#ED2024"/>
  <rect y="276" width="560" height="4" fill="#278E43"/>

  <!-- the sun: 21 rays -->
  <g transform="translate(280 124)" fill="#FEBD11">
    <circle r="48" opacity="0.14"/>
    <g opacity="0.22">
      <use href="#ray"/>
      <use href="#ray" transform="rotate(17.142857)"/>
      <use href="#ray" transform="rotate(34.285714)"/>
      <use href="#ray" transform="rotate(51.428571)"/>
      <use href="#ray" transform="rotate(68.571429)"/>
      <use href="#ray" transform="rotate(85.714286)"/>
      <use href="#ray" transform="rotate(102.857143)"/>
      <use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(137.142857)"/>
      <use href="#ray" transform="rotate(154.285714)"/>
      <use href="#ray" transform="rotate(171.428571)"/>
      <use href="#ray" transform="rotate(188.571429)"/>
      <use href="#ray" transform="rotate(205.714286)"/>
      <use href="#ray" transform="rotate(222.857143)"/>
      <use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(257.142857)"/>
      <use href="#ray" transform="rotate(274.285714)"/>
      <use href="#ray" transform="rotate(291.428571)"/>
      <use href="#ray" transform="rotate(308.571429)"/>
      <use href="#ray" transform="rotate(325.714286)"/>
      <use href="#ray" transform="rotate(342.857143)"/>
    </g>
  </g>

  <!-- centre: "language" in both varieties -->
  <g text-anchor="middle" fill="#F7F3E8">
    <text x="280" y="134" font-family="Vazirmatn" font-weight="700" font-size="58" direction="rtl">زمان</text>
    <text x="280" y="180" font-family="IBM Plex Sans" font-weight="600" font-size="30">ziman</text>
    <text x="280" y="204" font-family="DejaVu Sans" font-size="13" opacity="0.7">/zɪˈmaːn/</text>
    <text x="280" y="252" font-family="IBM Plex Sans" font-weight="500" font-size="11"
          letter-spacing="4" opacity="0.75">KURDISH LEXICON</text>
  </g>

  <g stroke="#F7F3E8" stroke-opacity="0.16">
    <line x1="140" y1="56" x2="140" y2="200"/>
    <line x1="420" y1="56" x2="420" y2="200"/>
    <line x1="30" y1="208" x2="110" y2="208"/>
    <line x1="450" y1="208" x2="530" y2="208"/>
  </g>

  <!-- left: Sorani, a sample form with its IPA, GitHub -->
  <g text-anchor="middle" fill="#F7F3E8">
    <text x="70" y="78" font-family="Vazirmatn" font-weight="600" font-size="22" direction="rtl">سۆرانی</text>
    <text x="70" y="96" font-family="IBM Plex Sans" font-size="10" opacity="0.7">Sorani · ckb</text>
    <text x="70" y="136" font-family="Vazirmatn" font-weight="500" font-size="17" direction="rtl">کتێبەکەم</text>
    <text x="70" y="153" font-family="DejaVu Sans" font-size="10" fill="#FEBD11">/kɯteːbækæm/</text>
    <text x="70" y="168" font-family="IBM Plex Sans" font-style="italic" font-size="9.5" opacity="0.6">my book</text>
    <text x="70" y="226" font-family="IBM Plex Sans" font-weight="600" font-size="7.5" letter-spacing="2" fill="#FEBD11">GITHUB</text>
    <text x="70" y="240" font-family="IBM Plex Sans" font-size="9" opacity="0.85">github.com/</text>
    <text x="70" y="252" font-family="IBM Plex Sans" font-weight="600" font-size="9" opacity="0.85">0xdolan/zimankit</text>
  </g>

  <!-- right: Kurmanji, a sample form with its IPA, Kaggle -->
  <g text-anchor="middle" fill="#F7F3E8">
    <text x="490" y="78" font-family="IBM Plex Sans" font-weight="600" font-size="21">Kurmancî</text>
    <text x="490" y="96" font-family="IBM Plex Sans" font-size="10" opacity="0.7">Kurmanji · kmr</text>
    <text x="490" y="136" font-family="IBM Plex Sans" font-weight="500" font-size="17">jinekê</text>
    <text x="490" y="153" font-family="DejaVu Sans" font-size="10" fill="#FEBD11">/ʒɪnɛkeː/</text>
    <text x="490" y="168" font-family="IBM Plex Sans" font-style="italic" font-size="9.5" opacity="0.6">a woman (oblique)</text>
    <text x="490" y="226" font-family="IBM Plex Sans" font-weight="600" font-size="7.5" letter-spacing="2" fill="#FEBD11">KAGGLE</text>
    <text x="490" y="240" font-family="IBM Plex Sans" font-size="9" opacity="0.85">kaggle.com/datasets/</text>
    <text x="490" y="252" font-family="IBM Plex Sans" font-weight="600" font-size="9" opacity="0.85">zeroxdolan/kurdish-lexicon</text>
  </g>
</svg>
