<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100">
  <title>zimankit logo: anatomy</title>
  <rect width="2000" height="1100" rx="24" fill="#F4EDE0"/>
  <g transform="translate(508.57 58.57) scale(0.95982)"><path fill="#FEBD11" transform="translate(-178.00 52.00) scale(1.5333)" d="M450 150l11.24 76.264 33.222-69.563-11.738 76.19 52.249-56.68-33.674 69.344 66.634-38.761-52.616 56.338 75.098-17.399-66.885 38.327 76.89 5.51-75.21 16.909 71.85 27.929-76.852-6.011 60.425 47.867-71.666-28.397 43.632 63.55-60.113-48.259 22.962 73.589-43.217-63.834.25 77.087L450 376.264 427.518 450l.251-77.087-43.217 63.834 22.962-73.589-60.113 48.26 43.632-63.551-71.666 28.397 60.425-47.867-76.852 6.011 71.85-27.93-75.21-16.908 76.89-5.51-66.885-38.327 75.098 17.399-52.616-56.338 66.634 38.76-33.674-69.343 52.249 56.68-11.738-76.19 33.221 69.563z"/><g fill="none" stroke="#22332A" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"><path d="M430 190 L512 268 L594 190"/><path d="M512 268 V756"/><path d="M430 840 L512 756 L594 840"/><circle cx="512" cy="512" r="112"/></g><g fill="#22332A"><circle cx="512" cy="122" r="26"/><circle cx="512" cy="908" r="26"/></g></g>
  <path d="M1000.0 175.7 L700 136" stroke="#5B5F58" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="1000.0" cy="175.7" r="7" fill="#F4EDE0" stroke="#151A17" stroke-width="3"/>
  <text x="680.0" y="144.0" font-family="IBM Plex Sans" font-weight="600" font-size="36.0" fill="#151A17" text-anchor="end">Dot</text>
  <text x="680.0" y="184.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">protection against the evil eye;</text>
  <text x="680.0" y="216.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">a mark above the line, like a letter's dot</text>
  <path d="M1046.1 271.7 L1300 196" stroke="#5B5F58" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="1046.1" cy="271.7" r="7" fill="#F4EDE0" stroke="#151A17" stroke-width="3"/>
  <text x="1320.0" y="204.0" font-family="IBM Plex Sans" font-weight="600" font-size="36.0" fill="#151A17" text-anchor="start">Two branches</text>
  <text x="1320.0" y="244.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="start">growth and new life;</text>
  <text x="1320.0" y="276.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="start">Sorani and Kurmanji, one trunk</text>
  <path d="M1103.7 550.0 L1300 506" stroke="#5B5F58" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="1103.7" cy="550.0" r="7" fill="#F4EDE0" stroke="#151A17" stroke-width="3"/>
  <text x="1320.0" y="514.0" font-family="IBM Plex Sans" font-weight="600" font-size="36.0" fill="#151A17" text-anchor="start">Circle</text>
  <text x="1320.0" y="554.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="start">the cycle of life, completeness;</text>
  <text x="1320.0" y="586.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="start">language passed from one generation to the next</text>
  <path d="M796.5 461.7 L700 436" stroke="#5B5F58" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="796.5" cy="461.7" r="7" fill="#F4EDE0" stroke="#151A17" stroke-width="3"/>
  <text x="680.0" y="444.0" font-family="IBM Plex Sans" font-weight="600" font-size="36.0" fill="#151A17" text-anchor="end">Roj, the sun</text>
  <text x="680.0" y="484.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">21 rays, as on the flag of Kurdistan:</text>
  <text x="680.0" y="516.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">the source of life, a new day</text>
  <path d="M1000.0 711.2 L700 746" stroke="#5B5F58" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="1000.0" cy="711.2" r="7" fill="#F4EDE0" stroke="#151A17" stroke-width="3"/>
  <text x="680.0" y="754.0" font-family="IBM Plex Sans" font-weight="600" font-size="36.0" fill="#151A17" text-anchor="end">Trunk</text>
  <text x="680.0" y="794.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">one language that holds</text>
  <text x="680.0" y="826.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">the branches and the roots together</text>
  <path d="M1046.1 826.4 L1300 816" stroke="#5B5F58" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="1046.1" cy="826.4" r="7" fill="#F4EDE0" stroke="#151A17" stroke-width="3"/>
  <text x="1320.0" y="824.0" font-family="IBM Plex Sans" font-weight="600" font-size="36.0" fill="#151A17" text-anchor="start">Roots</text>
  <text x="1320.0" y="864.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="start">ancient roots in the land;</text>
  <text x="1320.0" y="896.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="start">the deep history of Kurdish</text>
  <path d="M1000.0 930.1 L700 986" stroke="#5B5F58" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="1000.0" cy="930.1" r="7" fill="#F4EDE0" stroke="#151A17" stroke-width="3"/>
  <text x="680.0" y="994.0" font-family="IBM Plex Sans" font-weight="600" font-size="36.0" fill="#151A17" text-anchor="end">Dot</text>
  <text x="680.0" y="1034.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">protection again, below the line:</text>
  <text x="680.0" y="1066.0" font-family="IBM Plex Sans" font-weight="400" font-size="25.0" fill="#5B5F58" text-anchor="end">the sign is guarded at both ends</text>
</svg>
