name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Test
        run: python -m pip install -e ".[dev]" && python -m pytest -q
      - name: Build wheel, sdist, .deb and source archives
        run: scripts/build_release.sh "$GITHUB_REF_NAME"
      - name: Test the .deb
        run: sudo apt-get install -y ./dist/python3-zimankit_*_all.deb && /usr/bin/zimankit --version
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "zimankit ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
