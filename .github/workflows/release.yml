name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Test
        run: python -m pip install -e ".[dev]" && python -m pytest -q
      - name: Build wheel, sdist, .deb and source archives
        run: scripts/build_release.sh "$GITHUB_REF_NAME"
      - name: Test the .deb
        run: sudo apt-get install -y ./dist/python3-zimankit_*_all.deb && /usr/bin/zimankit --version
      - name: Keep only the wheel and sdist for PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir pypi-dist
          cp "dist/zimankit-$version-py3-none-any.whl" "dist/zimankit-$version.tar.gz" pypi-dist/
          python -m pip install twine
          python -m twine check --strict pypi-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: pypi-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/

  # Trusted Publishing: PyPI trusts this workflow through OpenID Connect, so no password or token is stored.
  # One-time setup on pypi.org is described in CONTRIBUTING.md.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zimankit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "zimankit ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
