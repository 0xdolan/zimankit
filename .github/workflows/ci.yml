name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: zimankit --version && zimankit analyze کتێبەکەم jinekê

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine trove-classifiers
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check that PyPI will accept the classifiers
        run: |
          python - <<'PY'
          import tomllib
          from trove_classifiers import classifiers
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["classifiers"]
          bad = [c for c in declared if c not in classifiers]
          raise SystemExit(f"invalid classifiers: {bad}" if bad else 0)
          PY
