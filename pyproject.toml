[project]
name = "zimankit"
version = "0.1.0"
description = "Kurdish (Central / Sorani ckb and Northern / Kurmanji kmr) NLP skills: orthography, IPA, morphology, verbs, ergativity, language ID and wordlist building"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dolan H." }]
dependencies = []

[project.optional-dependencies]
data = ["mdict-utils>=1.3", "libzim>=3.4"]
kaggle = ["pyarrow>=15", "kaggle>=1.6"]
dev = ["pytest>=8"]

[project.scripts]
zimankit = "zimankit.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zimankit*"]

[tool.setuptools.package-data]
"zimankit.data" = ["*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
